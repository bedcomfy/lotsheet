name: CI

# Runs the full verify pipeline (type-check + tests + production build) on every
# push and pull request, so broken code can't reach main unnoticed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install UI test browser
        run: npx playwright install --with-deps chromium
      - name: Type-check, test, build
        run: npm run verify
